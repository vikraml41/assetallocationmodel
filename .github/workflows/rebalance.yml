name: RAAM Monthly Rebalance

on:
  schedule:
    # 02:00 UTC on the 1st of each month
    # = ~9pm CT on the last day of the prior month (markets long closed)
    - cron: "0 2 1 * *"
  workflow_dispatch:  # manual trigger button in the Actions UI

permissions:
  contents: write   # allow the workflow to commit state/last_allocation.json back

concurrency:
  group: raam-rebalance
  cancel-in-progress: false

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run rebalance
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_USER }}
          SMTP_TO:   ${{ secrets.SMTP_TO }}
          NOTIFY_CHANNEL: email
        run: python main.py rebalance

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last_allocation.json
          if git diff --cached --quiet; then
            echo "No state change to commit."
          else
            git commit -m "Monthly state update: $(date -u +%Y-%m-%d)"
            git push
          fi
